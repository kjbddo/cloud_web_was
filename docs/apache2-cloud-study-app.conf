# Apache2 site example for Cloud Study App.
# Example location on Ubuntu: /etc/apache2/sites-available/cloud-study-app.conf
#
# Required modules:
#   sudo a2enmod proxy proxy_http headers
#
# This file uses Ubuntu-style paths only as examples. The WAR application does
# not depend on Apache2 installation paths.

<VirtualHost *:80>
    ServerName cloud-study.local

    # Copy the whole folder below into Apache2's html/DocumentRoot area.
    # Project source folder:
    #   web-html/cloud-study-web/
    # Ubuntu example target:
    #   /var/www/html/cloud-study-web/
    DocumentRoot /var/www/html/

    <Directory /var/www/html/>
        Require all granted
        Options -Indexes
        DirectoryIndex index.html
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On

    # Keep proxy/load-balancer related headers visible to the WAS.
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Host "%{Host}i"

    # Tomcat example: WAR name is cloud-study-app.war, context path is /cloud-study-app.
    # Change only the target URL if your Tomcat host, port, or context path differs.
    # ROOT.war deployment example. Replace 10.0.1.10 with the WAS private IP.
    ProxyPass        /api/    http://10.0.1.10:8080/api/
    ProxyPassReverse /api/    http://10.0.1.10:8080/api/

    ErrorLog ${APACHE_LOG_DIR}/cloud-study-app-error.log
    CustomLog ${APACHE_LOG_DIR}/cloud-study-app-access.log combined
</VirtualHost>

# Optional load-balancing practice example.
# Enable modules first:
#   sudo a2enmod proxy proxy_http proxy_balancer lbmethod_byrequests headers
